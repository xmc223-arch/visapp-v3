<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>VJPXLZD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  :root{
    --ink:#f2f2f7; --dim:#8a8a9a; --line:rgba(255,255,255,.14);
    --acc:#00e5ff; --acc2:#ff2d9b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#050507;color:var(--ink);
    font-family:var(--mono);-webkit-user-select:none;user-select:none;
    touch-action:none;overscroll-behavior:none;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}

  /* ---------- barra superior ---------- */
  #top{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 7px) 8px 7px;
    display:flex;gap:5px;align-items:center;
    background:linear-gradient(to bottom,rgba(0,0,0,.80),rgba(0,0,0,.35) 60%,rgba(0,0,0,0));
    pointer-events:none;
  }
  #top > *{pointer-events:auto}
  .brand{
    font-size:9px;letter-spacing:.16em;color:var(--ink);margin-right:auto;white-space:nowrap;
    display:flex;align-items:center;gap:5px;text-shadow:0 1px 3px #000;
  }
  .brand b{font-weight:700}
  .brand .fps{color:var(--dim)}
  #beatdot{width:7px;height:7px;border-radius:50%;background:#333;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
  /* botones grandes, fondo sólido: legibles sobre cualquier visual */
  .btn{
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;
    padding:8px 11px;border-radius:8px;
    border:1px solid rgba(255,255,255,.30);
    background:rgba(0,0,0,.65);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:#fff;cursor:pointer;transition:transform .09s;white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.9);
  }
  .btn:active{transform:scale(.93)}
  .btn.on { color:#001014;background:var(--acc); border-color:#fff;text-shadow:none;font-weight:800}
  .btn.on2{ color:#1a0010;background:var(--acc2);border-color:#fff;text-shadow:none;font-weight:800}

  /* ---------- panel inferior ---------- */
  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(5,5,9,.80);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:5px 8px calc(env(safe-area-inset-bottom,0px) + 6px);
    transition:transform .26s cubic-bezier(.4,0,.2,1);
  }
  body.hideui #panel{transform:translateY(115%)}
  body.hideui #top{opacity:0;transition:opacity .22s}

  .row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .row::-webkit-scrollbar{display:none}
  #scenes{margin-bottom:5px}
  #utils{margin-top:5px}
  .chip{
    flex:1 1 0;min-width:0;font-family:var(--mono);
    font-size:8.5px;font-weight:600;letter-spacing:.08em;padding:7px 3px;border-radius:14px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:#c8c8d4;cursor:pointer;
    text-align:center;white-space:nowrap;
  }
  .chip:active{transform:scale(.95)}
  .chip.on{background:#fff;color:#000;border-color:#fff;font-weight:800}
  .chip.acc{background:var(--acc);color:#001014;border-color:var(--acc);font-weight:800}
  .chip.acc2{background:var(--acc2);color:#1a0010;border-color:var(--acc2);font-weight:800}

  /* ---------- knobs ---------- */
  #knobs{display:grid;grid-template-columns:repeat(5,1fr);gap:0 2px;margin-bottom:5px}
  .knob{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:ns-resize;padding:1px 0}
  .dial{
    width:38px;height:38px;border-radius:50%;position:relative;
    background:conic-gradient(from 225deg,var(--acc) 0deg 0deg,rgba(255,255,255,.08) 0deg 270deg,transparent 270deg 360deg);
  }
  .dial::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#0a0a0f;border:1px solid rgba(255,255,255,.09)}
  .ind{position:absolute;width:2px;height:11px;background:#fff;border-radius:2px;top:6px;left:calc(50% - 1px);transform-origin:50% 13px;z-index:2}
  .klabel{font-size:7px;letter-spacing:.05em;color:var(--dim);line-height:1}
  .kval{font-size:7.5px;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}

  /* ---------- faders ---------- */
  .ftrack{
    height:18px;border-radius:4px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);position:relative;overflow:hidden;cursor:ew-resize;margin-bottom:3px;
  }
  .ffill{position:absolute;inset:0;width:50%;background:linear-gradient(90deg,rgba(255,45,155,.18),rgba(255,45,155,.7))}
  .fmeter{position:absolute;top:0;bottom:0;left:0;width:0;background:rgba(255,255,255,.30);z-index:2}
  .ftxt{
    position:absolute;inset:0;z-index:3;display:flex;justify-content:space-between;align-items:center;
    padding:0 6px;font-size:7.5px;font-weight:600;letter-spacing:.1em;color:#fff;pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;
  }

  #showui{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:30;display:none}
  body.hideui #showui{display:block}
  #err{
    position:fixed;inset:auto 10px 10px 10px;z-index:50;max-height:45vh;overflow:auto;
    background:#2a0008;border:1px solid #ff3355;color:#ffb3c1;padding:10px;border-radius:8px;
    font-size:10px;white-space:pre-wrap;display:none;
  }
  #toast{
    position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;
    background:rgba(0,0,0,.88);border:1px solid var(--line);border-radius:7px;
    padding:9px 15px;font-size:10px;letter-spacing:.06em;opacity:0;transition:opacity .3s;
    pointer-events:none;text-align:center;max-width:80vw;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top">
  <div class="brand"><span id="beatdot"></span><b>VJPXLZD</b> <span class="fps" id="fps">--</span></div>
  <button class="btn" id="bCam">CAM OFF</button>
  <button class="btn" id="bMic">MIC</button>
  <button class="btn" id="bHide">UI</button>
</div>

<div id="panel">
  <div class="row" id="scenes"></div>
  <div id="knobs"></div>
  <div id="faders"></div>
  <div class="row" id="utils">
    <button class="chip" id="bAuto">AUTO</button>
    <button class="chip" id="bRnd">RANDOM</button>
    <button class="chip" id="bReset">ZERO</button>
    <button class="chip" id="bLift">LIFT</button>
    <button class="chip" id="bFlip">FLIP</button>
    <button class="chip" id="bRes">60%</button>
  </div>
</div>

<button class="btn" id="showui">UI</button>
<div id="err"></div>
<div id="toast"></div>

<script>
"use strict";
/* ==============================================================
   VISAPP v0.3
   CHURN  — simulación de pintura por feedback
   RELIEF — domain warping + normales por gradiente + iridiscencia
   MIRROR — túnel log-polar espejeado
   CHROME — metal líquido (metaballs por raymarching)
   Audio con normalización adaptativa (AGC), transientes y beat.
   ============================================================== */

const $ = s => document.querySelector(s);
const cvs = $('#gl');
const gl = cvs.getContext('webgl2', {alpha:false, antialias:false, powerPreference:'high-performance'});

function fatal(m){ const e=$('#err'); e.style.display='block'; e.textContent=m; console.error(m); }
if(!gl) fatal('Este navegador no soporta WebGL2.\nEn iPhone necesitas iOS 15 o superior.');

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.opacity='1'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity='0',1500); }

/* -------------------------------------------------- 1 · PARÁMETROS */
const SCENES = ['MELT','OIL','MIRROR','CHROME','FLOW'];

/* rnd = ventana que usa el botón RND. Más angosta que el rango total para que
   no caiga en extremos que apagan el visual (FEED en 0, DETAIL en 0, etc.) */
const P = {
  push  : {label:'PUSH',   min:0, max:1, def:0.35, auto:0.35, rnd:[0.15, 0.85]},
  swirl : {label:'SWIRL',  min:0, max:1, def:0.10, auto:0.30, rnd:[0.00, 0.55]},
  detail: {label:'DETAIL', min:0, max:1, def:0.45, auto:0.35, rnd:[0.15, 0.85]},
  color : {label:'COLOR',  min:0, max:1, def:0.55, auto:1.00, rnd:[0.00, 1.00]},
  feed  : {label:'FEED',   min:0, max:1, def:0.50, auto:0.25, rnd:[0.25, 0.90]},
};
const F = {
  camMix : {label:'CAM',  min:0, max:1, def:0.60},
  bassAmt: {label:'BASS', min:0, max:1, def:0.85},
  highAmt: {label:'HIGH', min:0, max:1, def:0.70},
};

const val = {}, base = {};
for(const k in P){ val[k]=P[k].def; base[k]=P[k].def; }
for(const k in F){ val[k]=F[k].def; }

let sceneIdx = 0, autoOn = false, RES_SCALE = 0.6;

const FRESH = location.search.indexOf('d') >= 0;   /* ?d arranca con valores por defecto */
if(FRESH){ try{ localStorage.removeItem('visapp.v3'); }catch(e){} }
try{
  const s = FRESH ? {} : JSON.parse(localStorage.getItem('visapp.v3') || '{}');
  for(const k in (s.val||{})) if(k in val) val[k] = s.val[k];
  for(const k in P) base[k] = val[k];
  if(typeof s.scene === 'number' && s.scene < SCENES.length) sceneIdx = s.scene;
  if(typeof s.res === 'number') RES_SCALE = s.res;
}catch(e){}
{ const h = parseInt(location.hash.replace('#',''), 10);
  if(!isNaN(h) && h >= 0 && h < SCENES.length) sceneIdx = h; }
function save(){ try{ localStorage.setItem('visapp.v3', JSON.stringify({val, scene:sceneIdx, res:RES_SCALE})); }catch(e){} }

/* -------------------------------------------------- 2 · SHADERS */
const VS = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  float x = float((gl_VertexID << 1) & 2);
  float y = float(gl_VertexID & 2);
  vUv = vec2(x, y);
  gl_Position = vec4(vUv * 2.0 - 1.0, 0.0, 1.0);
}`;

const COMMON = `
precision highp float;
const float PI  = 3.14159265359;
const float TAU = 6.28318530718;

uniform vec2  uRes;
uniform float uTime;
uniform int   uScene;
uniform float uPush, uSwirl, uDetail, uColor, uFeed;
uniform float uBass, uMid, uHigh, uLevel, uHit, uBeat, uTog, uRnd;
uniform float uLift, uMotion, uBright;
uniform float uCamMix, uCamAspect, uMirrorX;
uniform float uFrame, uSteps;

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
vec4 sig4(vec4 x){ return x/(1.0+abs(x)); }
vec3 sig3(vec3 x){ return x/(1.0+abs(x)); }

vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}
vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y)/(6.0*d + 1e-10)), d/(q.x + 1e-10), q.x);
}
/* paleta coseno (IQ) — base de los looks iridiscentes */
vec3 pal(float t){
  return 0.5 + 0.5*cos(TAU*(vec3(0.0, 0.33, 0.67) + t));
}

float hash21(vec2 p){
  p = fract(p*vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x*p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0 - 2.0*f);
  float a = hash21(i), b = hash21(i+vec2(1.0,0.0));
  float c = hash21(i+vec2(0.0,1.0)), d = hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm2(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<2;i++){ s+=a*vnoise(p); p=rot(0.63)*p*2.03; a*=0.5; } return s*1.334; }
float fbm3(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=rot(0.63)*p*2.03; a*=0.5; } return s*1.143; }
`;

/* ---------------- pasada de simulación ---------------- */
const FS_SIM = `#version 300 es
${COMMON}
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uPrev;
uniform sampler2D uCam;
uniform sampler2D uVel;

vec3 camS(vec2 q){
  vec2 uv = vec2(q.x / max(uCamAspect, 0.001), q.y)*0.5 + 0.5;
  uv.x = mix(uv.x, 1.0 - uv.x, uMirrorX);
  return texture(uCam, clamp(uv, 0.0, 1.0)).rgb;
}

/* ============ MELT — espejo líquido ============
   La cámara ES la imagen: se muestrea refractada por un campo de flujo y se
   arrastra sobre sí misma, así que escurre y se estira sin dejar de ser
   reconocible. Donde hay movimiento se derrite más.
   RGB = imagen derretida, A = altura para el brillo mojado.
============================================================== */
vec4 simMelt(vec2 uv, vec2 uvc){
  float t  = uTime;
  vec2  px = 1.0/uRes;
  float sc = 0.7 + uDetail*3.5;

  /* campo de flujo: pseudo-curl de dos fbm desfasados */
  float n1 = fbm3(uvc*sc + vec2(0.0, t*0.11));
  float n2 = fbm3(uvc*sc + vec2(t*0.09, 0.0) + 19.7);
  vec2 flow = vec2(n2 - 0.5, 0.5 - n1)*2.0;

  /* dirección de escurrimiento: flujo + gravedad + swirl + lift */
  vec2 disp = flow*(0.40 + uPush*1.8);
  disp += vec2(0.0, -1.0)*(0.18 + uBass*0.65 + uHit*0.55);
  if(uSwirl > 0.02) disp += vec2(-uvc.y, uvc.x)/(length(uvc) + 0.30)*uSwirl*2.4;
  if(uLift  > 0.02) disp += vec2(-1.0, 0.0)*uLift*3.2;

  float sp = 0.80 + uPush*2.0 + uBass*0.80 + uHit*0.70;
  vec2 suv = uv - disp*px*sp*2.4;
  vec4 pv  = texture(uPrev, suv);
  vec3 prev = pv.rgb;

  /* fuente: cámara refractada por el mismo campo; sin cámara, gradiente */
  vec2 warp = flow*(0.015 + uPush*0.10) + (prev.rg - 0.5)*0.04*(1.0 + uHigh*0.9);
  vec3 src = pal(uColor + n1*0.9 + n2*0.4)*(0.35 + 0.65*n1);
  if(uCamMix > 0.001) src = mix(src, camS(uvc + warp), uCamMix);

  /* movimiento aparente: donde cambia respecto al frame anterior, escurre más */
  float mv = clamp(length(src - prev)*1.6, 0.0, 1.0);
  prev = mix(prev, texture(uPrev, suv - disp*px*mv*sp*1.8).rgb, 0.6);

  /* la cámara alimenta, el frame anterior derrite */
  vec3 col = mix(src, prev, clamp(uFeed*0.97, 0.0, 0.97));
  col = mix(col, prev, mv*0.35);

  float h = dot(col, vec3(0.333)) + (n1 - 0.5)*0.35 + mv*0.25;
  return vec4(clamp(col, 0.0, 1.0), h);
}

/* ============ RELIEF ============ */
vec4 simRelief(vec2 uv, vec2 uvc){
  float t = uTime;
  float r = length(uvc);

  float sc = 0.45 + uDetail*7.0;                       /* DETAIL: macro → micro */
  vec2 p = uvc*sc;
  p = rot(uSwirl*7.0/(r + 0.30) + t*0.25*uSwirl)*p;    /* SWIRL: vórtice real */

  float flow = t*(0.08 + uPush*1.0);
  float w    = 0.25 + uPush*6.5 + uHit*0.9;            /* PUSH: profundidad del warp */

  vec2 q = vec2(fbm2(p + flow*0.30), fbm2(p + vec2(5.2,1.3) - flow*0.26));
  vec2 s = vec2(fbm2(p + w*q + vec2(1.7,9.2) + flow*0.55),
                fbm2(p + w*q + vec2(8.3,2.8) - flow*0.42));
  float h = fbm3(p + w*s*1.25 + flow*0.22);

  h += uBass*0.30 + uHit*0.18 + uMotion*0.30;

  if(uCamMix > 0.001) h = mix(h, dot(camS(uvc), vec3(0.333))*1.35, uCamMix*0.9);

  vec2 fd = (s - 0.5)*(0.0015 + uFeed*0.026)*(0.4 + uPush*1.6);
  float prev = texture(uPrev, uv + fd).r;
  h = mix(h, prev, uFeed*0.90);
  return vec4(h, s, 1.0);
}

/* ============ MIRROR ============ */
vec4 simMirror(vec2 uv, vec2 uvc){
  float t = uTime;
  vec2 p = uvc*(0.75 + uPush*0.9 - uHit*0.10);
  p = rot(t*0.08 + uSwirl*(sin(t*0.3)*2.6 + t*0.35))*p;

  float a = atan(p.x, p.y);
  float r = length(p) + 0.30 - uBass*0.05;
  float rep = 1.0 + floor(uDetail*9.0);

  vec2 tuv = vec2(0.35/r + t*0.10*(0.25 + uPush*1.2) + uBeat*0.02, a/PI*rep);
  tuv = abs(fract(tuv*0.5)*2.0 - 1.0);

  float n = fbm2(tuv*4.0 + t*0.16);
  float band = pow(0.5 + 0.5*sin(n*8.0 - t*1.5 + uBass*4.5 + uHit*1.8), 1.4);
  vec3 pc = pal(uColor + n*0.4 + r*0.15)*band*r*2.0*(0.70 + uLevel*0.70 + uHigh*0.5);

  vec3 col = pc;
  if(uCamMix > 0.001){
    vec2 cuv = tuv + (n - 0.5)*uHigh*0.07;
    cuv.x = mix(cuv.x, 1.0 - cuv.x, uMirrorX);
    vec3 cam = texture(uCam, clamp(cuv, 0.0, 1.0)).rgb;
    col = mix(pc, cam*(0.25 + pc*2.4)*r*1.6, uCamMix);
  }

  vec2 fuv = (uv - 0.5)*(1.0 - 0.014 - uPush*0.025 - uHit*0.012);
  fuv = rot(0.004 + uSwirl*0.04 + uLift*0.06)*fuv + 0.5;
  col = max(col, texture(uPrev, fuv).rgb*(uFeed*0.985));
  return vec4(col, 1.0);
}

/* ============ CHROME — metal líquido ============ */
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0 - h);
}
float mapChrome(vec3 p){
  float k = 0.30 + uDetail*1.00;
  float T = uTime*(0.12 + uPush*1.1);
  float rad = 0.44 + uBass*0.16 + uHit*0.06;
  float d = 1e5;
  for(int i = 0; i < 5; i++){
    float fi = float(i);
    vec3 c = vec3(sin(T*(0.71 + fi*0.13) + fi*2.1),
                  cos(T*(0.63 + fi*0.17) + fi*1.3),
                  sin(T*(0.52 + fi*0.11) + fi*3.7))*(0.62 + 0.26*sin(fi*1.7));
    d = smin(d, length(p - c) - (rad + 0.07*sin(fi*2.0)), k);
  }
  d += 0.030*sin(p.x*5.0 + T*2.0)*sin(p.y*5.0 - T*1.4)*(0.15 + uHigh*0.9);
  return d;
}
vec3 nrmChrome(vec3 p){
  vec2 e = vec2(0.0018, 0.0);
  return normalize(vec3(
    mapChrome(p+e.xyy) - mapChrome(p-e.xyy),
    mapChrome(p+e.yxy) - mapChrome(p-e.yxy),
    mapChrome(p+e.yyx) - mapChrome(p-e.yyx)));
}
vec3 envChrome(vec3 rd){
  if(uCamMix > 0.001){
    vec2 e = vec2(atan(rd.z, rd.x)/TAU + 0.5, acos(clamp(rd.y, -1.0, 1.0))/PI);
    e.x = mix(e.x, 1.0 - e.x, uMirrorX);
    return texture(uCam, e).rgb*(1.3 + uHigh*0.5);
  }
  /* estudio: piso oscuro, cielo claro, softboxes y barras de color */
  vec3 sky = mix(vec3(0.015, 0.015, 0.025), vec3(0.95), smoothstep(-0.20, 0.60, rd.y));
  sky *= mix(pal(uColor + 0.55), vec3(1.0), 0.40);
  float sb = smoothstep(0.80, 0.99, sin(rd.y*7.0 + uTime*0.25 + uBeat)*0.5 + 0.5);
  sky += sb*(1.9 + uHit*0.8);
  float st = smoothstep(0.35, 0.65, fract(atan(rd.z, rd.x)/TAU*6.0 + uTime*0.03 + uBeat*0.03));
  sky += st*pal(uColor + 0.28)*(0.40 + uHigh*0.6);
  return sky;
}
vec4 simChrome(vec2 uv, vec2 uvc){
  vec3 ro = vec3(0.0, 0.0, -3.1 + uBass*0.18);
  float ang = uSwirl*TAU + uTime*0.12*uSwirl;
  ro.xz = rot(ang)*ro.xz;
  vec3 fw = normalize(-ro), rt = normalize(cross(vec3(0.0,1.0,0.0), fw)), up = cross(fw, rt);
  vec3 rd = normalize(uvc.x*rt + uvc.y*up + (1.45 - uHit*0.10)*fw);

  float tt = 0.0;
  bool hit = false;
  for(int i = 0; i < 80; i++){
    if(float(i) >= uSteps) break;
    float d = mapChrome(ro + rd*tt);
    if(d < 0.0022){ hit = true; break; }
    tt += d*0.85;
    if(tt > 11.0) break;
  }

  vec3 col;
  if(hit){
    vec3 p = ro + rd*tt;
    vec3 n = nrmChrome(p);
    vec3 rf = reflect(rd, n);
    float fres = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    vec3 refl = envChrome(rf);
    vec3 irid = pal(fres*1.9 + uColor + uTime*0.03 + p.z*0.12);
    col = refl*(0.55 + 0.80*fres)*mix(vec3(1.0), irid, 0.55);
    col += pow(clamp(dot(rf, normalize(vec3(0.6, 0.8, -0.5))), 0.0, 1.0), 42.0)*(1.5 + uHit*1.0);
    col += fres*irid*(0.25 + uHigh*0.45);
  }else{
    col = envChrome(rd)*0.32;
  }

  vec2 fuv = (uv - 0.5)*(1.0 - 0.012 - uPush*0.02) + 0.5;
  col = max(col, texture(uPrev, fuv).rgb*(uFeed*0.94));
  return vec4(col, 1.0);
}

/* ============ FLOW — fluido de retroalimentación ============
   El color se transporta por el campo de velocidad. La cámara nunca se ve
   directa: sólo inyecta pigmento donde hay movimiento.
============================================================== */
vec4 simFlow(vec2 uv, vec2 uvc){
  vec2 px = 1.0/uRes;
  vec4 vs = texture(uVel, uv);
  vec2 v  = vs.rg;
  float mv = vs.a;

  /* advección del color */
  vec2 suv = uv - v*px;
  vec3 col = texture(uPrev, suv).rgb;

  /* difusión: DETAIL bajo = más viscoso y suave */
  vec3 bl = ( texture(uPrev, suv + vec2(px.x, 0.0)).rgb + texture(uPrev, suv - vec2(px.x, 0.0)).rgb
            + texture(uPrev, suv + vec2(0.0, px.y)).rgb + texture(uPrev, suv - vec2(0.0, px.y)).rgb )*0.25;
  col = mix(col, bl, 0.10 + (1.0 - uDetail)*0.26);

  /* inyección de pigmento */
  if(uCamMix > 0.001){
    vec3 cam = camS(uvc);
    float lum = dot(cam, vec3(0.299, 0.587, 0.114));
    vec3 tint = pal(uColor + lum*0.85);
    vec3 ink  = mix(tint, cam, 0.15 + uColor*0.30);   /* conserva parte del color real */
    col = mix(col, ink, clamp(mv*(0.10 + uPush*0.28), 0.0, 0.55));
  }else{
    float n = fbm3(uvc*(1.0 + uDetail*3.0) + uTime*0.10);
    col = mix(col, pal(uColor + n*0.9), 0.035*smoothstep(0.45, 0.80, n));
  }

  /* persistencia: FEED va de ~2 s de memoria a casi permanente */
  col *= 0.990 + uFeed*0.0095;
  col -= 0.0003;

  return vec4(clamp(col, 0.0, 1.0), mv);
}

void main(){
  vec2 uv = vUv;
  vec2 uvc = uv*2.0 - 1.0;
  uvc.x *= uRes.x/uRes.y;

  if(uFrame < 3.0){
    fragColor = vec4(fbm3(uvc*5.0), fbm3(uvc*5.0 + 3.1), fbm3(uvc*5.0 + 7.7), fbm3(uvc*4.0 + 11.0));
    return;
  }

  if      (uScene == 4) fragColor = simFlow(uv, uvc);
  else if (uScene == 0) fragColor = simMelt(uv, uvc);
  else if (uScene == 1) fragColor = simRelief(uv, uvc);
  else if (uScene == 2) fragColor = simMirror(uv, uvc);
  else                  fragColor = simChrome(uv, uvc);
}`;

/* ---------------- pasada de física (solo FLOW) ----------------
   rg = velocidad (px/frame), b = luminancia del frame anterior,
   a = magnitud de movimiento suavizada.
--------------------------------------------------------------- */
const FS_VEL = `#version 300 es
${COMMON}
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uVel;
uniform sampler2D uCam;

vec3 camV(vec2 q){
  vec2 uv = vec2(q.x / max(uCamAspect, 0.001), q.y)*0.5 + 0.5;
  uv.x = mix(uv.x, 1.0 - uv.x, uMirrorX);
  return texture(uCam, clamp(uv, 0.0, 1.0)).rgb;
}
float lumaV(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

void main(){
  vec2 uv  = vUv;
  vec2 uvc = uv*2.0 - 1.0;
  float aspect = uRes.x/uRes.y;
  uvc.x *= aspect;
  vec2 px = 1.0/uRes;

  if(uFrame < 3.0){ fragColor = vec4(0.0); return; }

  vec4 s = texture(uVel, uv);

  /* advección semi-lagrangiana: la velocidad se transporta a sí misma */
  vec2 v = texture(uVel, uv - s.rg*px).rg;

  float lum = 0.0, mv = 0.0;
  vec2 grad = vec2(0.0);

  if(uCamMix > 0.001){
    vec3 cam = camV(uvc);
    lum = lumaV(cam);
    /* diferencia con el frame anterior = movimiento */
    mv = smoothstep(0.015, 0.20, abs(lum - s.b));
    /* gradiente de luminancia: el fluido se empuja por los bordes de la imagen */
    vec2 eu = vec2(aspect, 1.0)*px*4.0;
    grad = vec2(lumaV(camV(uvc + vec2(eu.x, 0.0))) - lumaV(camV(uvc - vec2(eu.x, 0.0))),
                lumaV(camV(uvc + vec2(0.0, eu.y))) - lumaV(camV(uvc - vec2(0.0, eu.y))));
  }else{
    /* sin cámara: un campo de ruido hace de "movimiento" para que siga vivo */
    float na = fbm2(uvc*2.0 + uTime*0.10);
    float nb = fbm2(uvc*2.0 + 13.1 - uTime*0.08);
    grad = vec2(nb - 0.5, 0.5 - na)*0.6;
    mv = 0.45;
    lum = na;
  }

  /* fuerza principal */
  v += grad*mv*(0.6 + uPush*6.0)*(1.0 + uBass*0.8);

  /* turbulencia por curl de ruido, escalada por el movimiento */
  float sc = 1.5 + uDetail*4.0;
  float n1 = fbm2(uvc*sc + uTime*0.15);
  float n2 = fbm2(uvc*sc + 31.7 - uTime*0.12);
  v += vec2(n2 - 0.5, 0.5 - n1)*2.0*uSwirl*(0.4 + mv*3.0)*(0.6 + uHigh*1.0);

  /* viscosidad: la velocidad se difunde hacia los vecinos */
  vec2 lap = ( texture(uVel, uv + vec2(px.x, 0.0)).rg + texture(uVel, uv - vec2(px.x, 0.0)).rg
             + texture(uVel, uv + vec2(0.0, px.y)).rg + texture(uVel, uv - vec2(0.0, px.y)).rg )*0.25;
  v = mix(v, lap, 0.12 + (1.0 - uDetail)*0.34);

  /* disipación */
  v *= 0.962 + uFeed*0.034;
  v = clamp(v, -55.0, 55.0);

  fragColor = vec4(v, lum, max(mv, s.a*0.92));
}`;

/* ---------------- pasada de salida ---------------- */
const FS_OUT = `#version 300 es
${COMMON}
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform sampler2D uVel;

void main(){
  vec2 uv = vUv;
  vec3 c;

  if(uScene == 4){
    /* FLOW — acumulación, desenfoque direccional, refracción y brillo por velocidad */
    vec2 px = 1.0/uRes;
    vec2 v  = texture(uVel, uv).rg;
    float sp = length(v);

    vec3 acc = vec3(0.0);
    for(int i = 0; i < 4; i++) acc += texture(uTex, uv - v*px*float(i)*0.45).rgb;
    c = acc*0.25;

    /* refracción: los canales se separan a lo largo del flujo */
    c.r = texture(uTex, uv - v*px*0.9).r;
    c.b = texture(uTex, uv + v*px*0.9).b;

    /* la saturación sube donde hay movimiento */
    vec3 hv = rgb2hsv(clamp(c, 0.0, 1.0));
    hv.y = clamp(hv.y*(0.85 + smoothstep(0.0, 8.0, sp)*0.90), 0.0, 0.90);
    c = hsv2rgb(hv);

    /* el brillo aparece sólo en zonas rápidas */
    c += pal(uColor + 0.35)*smoothstep(6.0, 22.0, sp)*(0.30 + uHigh*0.45);

    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    if(lum > 0.82) c *= (0.82 + (lum - 0.82)/(1.0 + (lum - 0.82)*2.6))/max(lum, 1e-4);

  } else if(uScene == 0){
    /* MELT — la imagen derretida con acabado mojado */
    vec2 e = 1.0/uRes;
    vec4 s = texture(uTex, uv);
    c = s.rgb;

    float rel = 14.0 + uDetail*42.0;
    float hx = texture(uTex, uv + vec2(e.x,0.0)).a - texture(uTex, uv - vec2(e.x,0.0)).a;
    float hy = texture(uTex, uv + vec2(0.0,e.y)).a - texture(uTex, uv - vec2(0.0,e.y)).a;
    vec3 n = normalize(vec3(-hx*rel, -hy*rel, 1.0));

    vec3 L = normalize(vec3(cos(uTime*0.30)*0.55, sin(uTime*0.24)*0.55, 0.82));
    float spec = pow(clamp(dot(reflect(-L, n), vec3(0.0,0.0,1.0)), 0.0, 1.0), 26.0 + uDetail*50.0);
    float fres = pow(1.0 - clamp(n.z, 0.0, 1.0), 2.0);

    c *= 0.80 + 0.35*clamp(dot(n, L), 0.0, 1.0);        /* modelado suave */
    c += spec*0.45*(0.6 + uHigh*0.4);                   /* brillo mojado */
    c = mix(c, c*pal(uColor + 0.5)*1.6, fres*0.35);     /* borde teñido: vidrio */

    vec3 hv = rgb2hsv(clamp(c, 0.0, 4.0));
    hv.y = min(hv.y*1.05, 0.85);
    c = hsv2rgb(hv);

    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float kn = 0.80;
    if(lum > kn) c *= (kn + (lum - kn)/(1.0 + (lum - kn)*2.6))/max(lum, 1e-4);

  } else if(uScene == 1){
    vec2 e = 1.0/uRes;
    float hC = texture(uTex, uv).r;
    float hx = texture(uTex, uv + vec2(e.x,0.0)).r - texture(uTex, uv - vec2(e.x,0.0)).r;
    float hy = texture(uTex, uv + vec2(0.0,e.y)).r - texture(uTex, uv - vec2(0.0,e.y)).r;

    float relief = 26.0 + uDetail*70.0;
    vec3 n = normalize(vec3(-hx*relief, -hy*relief, 1.0));

    float la = uTime*0.22 + uBeat*0.30;                /* la luz se mueve y pega en el beat */
    vec3 L = normalize(vec3(cos(la)*0.75, sin(la*0.83)*0.75, 0.72));
    float diff = clamp(dot(n, L), 0.0, 1.0);
    float spec = pow(clamp(dot(reflect(-L, n), vec3(0.0,0.0,1.0)), 0.0, 1.0), 16.0 + uDetail*70.0);
    float fres = pow(1.0 - clamp(n.z, 0.0, 1.0), 2.2);

    vec3 base = mix(pal(hC*1.3 + uColor + fres*0.5), pal(uColor + 0.5), 0.25);

    float bands = 3.0 + uDetail*46.0;
    float f = fract(hC*bands + uTime*0.05*uPush);
    float m = min(f, 1.0 - f);
    float lw = 0.030 + uHigh*0.05 + uHit*0.02;
    float line = 1.0 - smoothstep(0.0, lw, m);
    float halo = 1.0 - smoothstep(0.0, lw*2.8, m);
    vec3 lineCol = pal(uColor + 0.52);
    vec3 haloCol = pal(uColor + 0.16);

    c  = base*(0.18 + 1.05*diff);
    c += spec*(0.85 + uHigh*0.70);
    c += fres*haloCol*(0.25 + uBass*0.35);
    c  = mix(c, haloCol, halo*0.35);
    c  = mix(c, lineCol, line*0.92);

    vec3 hv = rgb2hsv(clamp(c, 0.0, 1.0));
    hv.y = clamp(hv.y*1.55, 0.0, 1.0);
    hv.z = pow(hv.z, 0.88);
    c = hsv2rgb(hv);

  } else if(uScene == 2){
    c = texture(uTex, uv).rgb;
    c = pow(clamp(c, 0.0, 1.0), vec3(0.92));

  } else {
    c = texture(uTex, uv).rgb;
    c = c/(1.0 + c);
    c = pow(clamp(c, 0.0, 1.0), vec3(0.78));
  }

  vec2 d = (uv - 0.5)*(0.002 + uHigh*0.006 + uHit*0.005);
  c.r = mix(c.r, texture(uTex, uv + d).r, 0.35);
  c.b = mix(c.b, texture(uTex, uv - d).b, 0.35);
  float vig = 1.0 - 0.32*pow(length(uv - 0.5)*1.35, 2.0);
  float kick = (uScene == 0) ? 1.0 + uHit*0.04 : 1.0 + uHit*0.09;
  fragColor = vec4(clamp(c*vig*kick, 0.0, 1.0), 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ fatal('Shader error:\n' + gl.getShaderInfoLog(s)); return null; }
  return s;
}
function program(fsSrc){
  const vs = compile(gl.VERTEX_SHADER, VS), fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if(!vs || !fs) return null;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){ fatal('Link error:\n' + gl.getProgramInfoLog(p)); return null; }
  return p;
}

const progSim = gl ? program(FS_SIM) : null;
const progOut = gl ? program(FS_OUT) : null;
const progVel = gl ? program(FS_VEL) : null;

const locCache = new Map();
function u(prog, name){
  let m = locCache.get(prog);
  if(!m){ m = new Map(); locCache.set(prog, m); }
  if(!m.has(name)) m.set(name, gl.getUniformLocation(prog, name));
  return m.get(name);
}
const set1f = (p,n,v)   => { const l=u(p,n); if(l) gl.uniform1f(l,v); };
const set1i = (p,n,v)   => { const l=u(p,n); if(l) gl.uniform1i(l,v); };
const set2f = (p,n,a,b) => { const l=u(p,n); if(l) gl.uniform2f(l,a,b); };

const vao = gl ? gl.createVertexArray() : null;

/* -------------------------------------------------- 3 · BUFFERS */
let fbo = [], vfbo = [], W = 1, H = 1, HALF = false;
if(gl){
  const eF  = gl.getExtension('EXT_color_buffer_float');
  const eHF = gl.getExtension('EXT_color_buffer_half_float');
  HALF = !!(eF || eHF);
}
function makeTarget(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if(HALF) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else     gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA,    w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if(!ok && HALF){ HALF = false; gl.deleteTexture(t); gl.deleteFramebuffer(f); return makeTarget(w, h); }
  return {t, f};
}
let frameCount = 0;
function resize(force){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(window.innerWidth  * dpr * RES_SCALE));
  const h = Math.max(2, Math.floor(window.innerHeight * dpr * RES_SCALE));
  if(w === W && h === H && !force) return;
  W = w; H = h;
  cvs.width = W; cvs.height = H;
  cvs.style.width = '100%'; cvs.style.height = '100%';
  fbo.forEach(o => { gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); });
  vfbo.forEach(o => { gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); });
  fbo  = [makeTarget(W, H), makeTarget(W, H)];
  vfbo = [makeTarget(W, H), makeTarget(W, H)];   /* campo de velocidad para FLOW */
  frameCount = 0;
}
if(gl) resize(true);
window.addEventListener('resize', () => setTimeout(resize, 120));
window.addEventListener('orientationchange', () => setTimeout(() => resize(true), 400));

/* -------------------------------------------------- 4 · MEDIA */
const CAM_MODES = ['OFF','TEX','SENS'];
let camMode = 0, micOn = false, facing = 'user';
let stream = null, video = null, camTex = null, camAspect = 4/3;
let sensorCvs = null, sensorCtx = null, prevPix = null;
let motion = 0, bright = 0.5;
let ac = null, analyser = null, freq = null, srcNode = null;

if(gl){
  camTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, camTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

async function applyMedia(wantVideo, wantAudio){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('getUserMedia no disponible'); return false; }
  if(!window.isSecureContext){ toast('Necesitas HTTPS'); return false; }
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  if(srcNode){ try{ srcNode.disconnect(); }catch(e){} srcNode = null; }
  video = null; prevPix = null;
  if(!wantVideo && !wantAudio) return true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: wantVideo ? {facingMode: facing, width:{ideal:640}, height:{ideal:480}} : false,
      audio: wantAudio ? {echoCancellation:false, noiseSuppression:false, autoGainControl:false} : false
    });
  }catch(e){ console.warn(e); toast('Permiso denegado'); return false; }
  if(wantVideo){
    video = document.createElement('video');
    video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
    video.muted = true; video.autoplay = true; video.srcObject = stream;
    try{ await video.play(); }catch(e){ console.warn(e); }
    camAspect = (video.videoWidth || 640)/(video.videoHeight || 480);
    if(!sensorCvs){
      sensorCvs = document.createElement('canvas');
      sensorCvs.width = 32; sensorCvs.height = 24;
      sensorCtx = sensorCvs.getContext('2d', {willReadFrequently:true});
    }
  }
  if(wantAudio){
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    srcNode = ac.createMediaStreamSource(stream);
    if(!analyser){
      analyser = ac.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.45;   /* poco suavizado: el nuestro es mejor */
      analyser.minDecibels = -88;
      analyser.maxDecibels = -22;
      freq = new Uint8Array(analyser.frequencyBinCount);
    }
    srcNode.connect(analyser);
  }
  return true;
}

function paintCamBtn(){
  const b = $('#bCam');
  b.textContent = 'CAM ' + CAM_MODES[camMode];
  b.className = 'btn' + (camMode === 1 ? ' on' : camMode === 2 ? ' on2' : '');
}
async function cycleCam(){
  const next = (camMode + 1) % 3;
  const ok = await applyMedia(next !== 0, micOn);
  if(!ok && next !== 0) return;
  camMode = next; paintCamBtn();
  if(camMode === 2) toast('Cámara como sensor');
}
async function toggleMic(){
  const next = !micOn;
  const ok = await applyMedia(camMode !== 0, next);
  if(!ok && next) return;
  micOn = next;
  if(!micOn) AU.reset();
  $('#bMic').className = 'btn' + (micOn ? ' on' : '');
  if(micOn) toast('Micrófono activo — calibrando');
}
async function flipCam(){
  facing = (facing === 'user') ? 'environment' : 'user';
  if(camMode !== 0) await applyMedia(true, micOn);
}
function updateCam(){
  if(!video || video.readyState < 2) return;
  if(camMode === 1){
    gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  }else if(camMode === 2 && sensorCtx){
    sensorCtx.drawImage(video, 0, 0, 32, 24);
    const d = sensorCtx.getImageData(0, 0, 32, 24).data;
    const n = d.length >> 2;
    if(!prevPix) prevPix = new Float32Array(n);
    let sum = 0, diff = 0;
    for(let i = 0; i < n; i++){
      const j = i << 2;
      const l = (d[j] + d[j+1] + d[j+2])/765;
      sum += l; diff += Math.abs(l - prevPix[i]); prevPix[i] = l;
    }
    bright = sum/n;
    motion += (Math.min(1, (diff/n)*14) - motion)*0.28;
  }
}

/* -------------------------------------------------- 5 · MOTOR DE AUDIO
   AGC por banda: la app se auto-calibra, música bajita o fuerte reaccionan igual.
-------------------------------------------------- */
const AU = {
  bass:0, mid:0, high:0, level:0,
  hit:0, beat:0, tog:0, rnd:0.5, bpm:0,
  _st:{}, _prevBass:0, _lastBeat:0, _iv:[], _period:0.5,
  reset(){
    this.bass = this.mid = this.high = this.level = 0;
    this.hit = this.beat = 0; this._st = {}; this._iv = []; this.bpm = 0;
  }
};
function agc(name, v){
  let st = AU._st[name];
  if(!st) st = AU._st[name] = {hi:0.15, lo:0.0};
  st.hi += (v > st.hi) ? (v - st.hi)*0.55 : -(st.hi - Math.max(v, 0.02))*0.0035;
  st.lo += (v < st.lo) ? (v - st.lo)*0.45 : (Math.min(v, st.hi) - st.lo)*0.0009;
  const rng = Math.max(0.035, st.hi - st.lo);
  return Math.min(1, Math.max(0, (v - st.lo)/rng));
}
function bandAvg(a, b){
  let s = 0; const n = Math.max(1, b - a);
  for(let i = a; i < b; i++) s += freq[i];
  return s/(n*255);
}
function updateAudio(now){
  if(!micOn || !analyser){ AU.beat *= 0.90; AU.hit *= 0.88; return; }
  analyser.getByteFrequencyData(freq);
  const nb = analyser.frequencyBinCount;              // 1024 bins ≈ 23 Hz c/u
  const rawB = bandAvg(2, Math.floor(nb*0.010));      // ~45–250 Hz
  const rawM = bandAvg(Math.floor(nb*0.010), Math.floor(nb*0.070));
  const rawH = bandAvg(Math.floor(nb*0.070), Math.floor(nb*0.300));
  const rawL = bandAvg(2, Math.floor(nb*0.300));

  const nB = agc('b', rawB), nM = agc('m', rawM), nH = agc('h', rawH), nL = agc('l', rawL);

  /* limitador de pendiente: por más fuerte que sea el golpe, el valor no puede
     saltar más de maxStep por frame. Esto es lo que quita el estroboscópico. */
  const slew = (cur, tgt, up, dn, maxStep) => {
    let d = (tgt - cur)*(tgt > cur ? up : dn);
    return cur + Math.max(-maxStep, Math.min(maxStep, d));
  };
  AU.bass  = slew(AU.bass,  nB, 0.30, 0.08, 0.060);
  AU.mid   = slew(AU.mid,   nM, 0.25, 0.07, 0.050);
  AU.high  = slew(AU.high,  nH, 0.35, 0.10, 0.070);
  AU.level = slew(AU.level, nL, 0.25, 0.06, 0.050);

  const dB = nB - AU._prevBass;
  AU._prevBass = nB;
  /* transiente más suave y con cola más larga */
  const kick = Math.min(1, Math.max(0, (dB - 0.070)*3.5));
  AU.hit = Math.max(AU.hit*0.93, kick*0.70);

  if(kick > 0.45 && (now - AU._lastBeat) > 0.26){
    if(AU._lastBeat > 0){
      const iv = now - AU._lastBeat;
      if(iv < 1.6){
        AU._iv.push(iv);
        if(AU._iv.length > 8) AU._iv.shift();
        const srt = AU._iv.slice().sort((a,b) => a - b);
        AU._period = srt[srt.length >> 1];
        AU.bpm = Math.round(60/AU._period);
      }
    }
    AU._lastBeat = now;
    AU.tog = 1 - AU.tog;
    AU.rnd = Math.random();
  }
  const phase = AU._period > 0 ? Math.min(1, (now - AU._lastBeat)/AU._period) : 1;
  AU.beat = Math.exp(-3.2*phase);
}

/* -------------------------------------------------- 6 · UI */
const fmt = v => v.toFixed(2);

const knobEls = {}, knobsWrap = $('#knobs');
for(const k in P){
  const d = document.createElement('div');
  d.className = 'knob';
  d.innerHTML = '<div class="dial"><div class="ind"></div></div>' +
                '<div class="klabel">' + P[k].label + '</div><div class="kval">0</div>';
  knobsWrap.appendChild(d);
  knobEls[k] = {dial:d.querySelector('.dial'), ind:d.querySelector('.ind'), val:d.querySelector('.kval')};
  bindKnob(d, k);
}
function drawKnob(k){
  const p = P[k], e = knobEls[k];
  const deg = ((val[k] - p.min)/(p.max - p.min))*270;
  e.dial.style.background =
    'conic-gradient(from 225deg, var(--acc) 0deg ' + deg + 'deg, rgba(255,255,255,.08) ' + deg + 'deg 270deg, transparent 270deg 360deg)';
  e.ind.style.transform = 'rotate(' + (-135 + deg) + 'deg)';
  e.val.textContent = fmt(val[k]);
}
function bindKnob(el, k){
  let y0 = 0, v0 = 0;
  el.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    el.setPointerCapture(ev.pointerId);
    y0 = ev.clientY; v0 = val[k];
  });
  el.addEventListener('pointermove', ev => {
    if(!el.hasPointerCapture(ev.pointerId)) return;
    const range = P[k].max - P[k].min;
    val[k] = base[k] = Math.min(P[k].max, Math.max(P[k].min, v0 + ((y0 - ev.clientY)/110)*range));
    drawKnob(k);
  });
  el.addEventListener('pointerup', ev => { try{ el.releasePointerCapture(ev.pointerId); }catch(e){} save(); });
}

const faderEls = {}, fadersWrap = $('#faders');
for(const k in F){
  const d = document.createElement('div');
  d.className = 'ftrack';
  d.innerHTML = '<div class="ffill"></div><div class="fmeter"></div>' +
                '<div class="ftxt"><span>' + F[k].label + '</span><span class="fv">0</span></div>';
  fadersWrap.appendChild(d);
  faderEls[k] = {fill:d.querySelector('.ffill'), v:d.querySelector('.fv'), meter:d.querySelector('.fmeter')};
  bindFader(d, k);
}
function drawFader(k){
  faderEls[k].fill.style.width = (((val[k] - F[k].min)/(F[k].max - F[k].min))*100) + '%';
  faderEls[k].v.textContent = fmt(val[k]);
}
function bindFader(el, k){
  const set = ev => {
    const r = el.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (ev.clientX - r.left)/r.width));
    val[k] = F[k].min + pct*(F[k].max - F[k].min);
    drawFader(k);
  };
  el.addEventListener('pointerdown', ev => { ev.preventDefault(); el.setPointerCapture(ev.pointerId); set(ev); });
  el.addEventListener('pointermove', ev => { if(el.hasPointerCapture(ev.pointerId)) set(ev); });
  el.addEventListener('pointerup',   ev => { try{ el.releasePointerCapture(ev.pointerId); }catch(e){} save(); });
}

const scenesWrap = $('#scenes');
SCENES.forEach((name, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === sceneIdx ? ' on' : '');
  b.textContent = name;
  b.onclick = () => {
    sceneIdx = i; frameCount = 0;
    Array.prototype.forEach.call(scenesWrap.children, (c, j) => c.className = 'chip' + (j === i ? ' on' : ''));
    save();
  };
  scenesWrap.appendChild(b);
});

for(const k in P) drawKnob(k);
for(const k in F) drawFader(k);
paintCamBtn();

$('#bCam').onclick  = cycleCam;
$('#bMic').onclick  = toggleMic;
$('#bFlip').onclick = flipCam;
$('#bAuto').onclick = () => {
  autoOn = !autoOn;
  $('#bAuto').className = 'chip' + (autoOn ? ' acc' : '');
  if(!autoOn){ for(const k in P){ val[k] = base[k]; drawKnob(k); } }
};
/* destello corto al tocar, para saber que sí registró */
function flash(el){
  el.classList.add('acc');
  setTimeout(() => el.classList.remove('acc'), 160);
}
$('#bRnd').onclick = () => {
  for(const k in P){
    const r = P[k].rnd || [P[k].min, P[k].max];
    base[k] = val[k] = r[0] + Math.random()*(r[1] - r[0]);
    drawKnob(k);
  }
  save(); flash($('#bRnd'));
};
/* ZERO — todos los knobs a cero (no a los valores por defecto) */
$('#bReset').onclick = () => {
  for(const k in P){ base[k] = val[k] = P[k].min; drawKnob(k); }
  save(); flash($('#bReset'));
};
const RES_STEPS = [0.4, 0.6, 0.85];
$('#bRes').onclick = () => {
  let i = RES_STEPS.indexOf(RES_SCALE); if(i < 0) i = 1;
  RES_SCALE = RES_STEPS[(i + 1) % RES_STEPS.length];
  $('#bRes').textContent = Math.round(RES_SCALE*100) + '%';
  resize(true); save();
};
$('#bRes').textContent = Math.round(RES_SCALE*100) + '%';
$('#bHide').onclick  = () => document.body.classList.add('hideui');
$('#showui').onclick = () => document.body.classList.remove('hideui');

let liftTarget = 0, lift = 0;
const bLift = $('#bLift');
bLift.addEventListener('pointerdown', ev => { ev.preventDefault(); liftTarget = 1; bLift.className = 'chip acc2'; });
['pointerup','pointercancel','pointerleave'].forEach(e =>
  bLift.addEventListener(e, () => { liftTarget = 0; bLift.className = 'chip'; }));

/* iOS ignora user-scalable=no: hay que matar el doble tap a mano o hace zoom */
let lastTouchEnd = 0;
document.addEventListener('touchend', ev => {
  const now = Date.now();
  if(now - lastTouchEnd < 350) ev.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener('gesturestart', ev => ev.preventDefault());

(async function wl(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} })();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && 'wakeLock' in navigator){
    try{ navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  }
});

/* -------------------------------------------------- 7 · LOOP */
let t = 0, lastMs = performance.now(), acc = 0, frames = 0, ping = 0;
const LFO = [0.11, 0.17, 0.07, 0.23, 0.13];
const beatdot = $('#beatdot');

function autoMod(now){
  if(!autoOn) return;
  let i = 0;
  for(const k in P){
    const p = P[k];
    if(p.auto > 0){
      const span = (p.max - p.min)*p.auto*0.5;
      /* el centro se mete hacia adentro para que la oscilación quepa completa:
         si el knob está pegado al 0 o al 1, antes se recortaba la mitad y no se veía */
      const center = Math.min(p.max - span, Math.max(p.min + span, base[k]));
      val[k] = center + Math.sin(now*LFO[i % LFO.length] + i*1.7)*span;
      drawKnob(k);
    }
    i++;
  }
}

function frame(ms){
  requestAnimationFrame(frame);
  if(!gl || !progSim || !progOut) return;

  const dt = Math.min(0.05, (ms - lastMs)/1000);
  lastMs = ms; t += dt;
  lift += (liftTarget - lift)*0.18;
  frameCount++;

  frames++; acc += dt;
  if(acc > 0.5){
    $('#fps').textContent = Math.round(frames/acc) + 'FPS' + (AU.bpm ? ' · ' + AU.bpm + 'BPM' : '');
    frames = 0; acc = 0;
  }

  updateAudio(t);
  updateCam();
  autoMod(t);

  const bi = Math.round(AU.beat*255);
  beatdot.style.background = micOn
    ? 'rgb(' + bi + ',' + Math.round(bi*0.35) + ',' + Math.round(90 + bi*0.55) + ')'
    : '#333';

  faderEls.bassAmt.meter.style.width = (AU.bass*100) + '%';
  faderEls.highAmt.meter.style.width = (AU.high*100) + '%';
  faderEls.camMix.meter.style.width  = (camMode === 2 ? motion*100 : 0) + '%';

  const B  = AU.bass*val.bassAmt;
  const M  = AU.mid*0.8;
  const Hh = AU.high*val.highAmt;
  const HT = AU.hit*val.bassAmt;
  const camMix = camMode === 1 ? val.camMix : 0;
  const steps = RES_SCALE <= 0.45 ? 50 : (RES_SCALE <= 0.65 ? 64 : 76);

  function common(p){
    set2f(p,'uRes', W, H);
    set1f(p,'uTime', t);
    set1i(p,'uScene', sceneIdx);
    set1f(p,'uPush', val.push);
    set1f(p,'uSwirl', val.swirl);
    set1f(p,'uDetail', val.detail);
    set1f(p,'uColor', val.color);
    set1f(p,'uFeed', val.feed);
    set1f(p,'uBass', B);
    set1f(p,'uMid', M);
    set1f(p,'uHigh', Hh);
    set1f(p,'uLevel', AU.level);
    set1f(p,'uHit', HT);
    set1f(p,'uBeat', AU.beat);
    set1f(p,'uTog', AU.tog);
    set1f(p,'uRnd', AU.rnd);
    set1f(p,'uLift', lift);
    set1f(p,'uMotion', camMode === 2 ? motion : 0);
    set1f(p,'uBright', camMode === 2 ? bright : 0.5);
    set1f(p,'uCamMix', camMix);
    set1f(p,'uCamAspect', camAspect);
    set1f(p,'uMirrorX', facing === 'user' ? 1 : 0);
    set1f(p,'uFrame', frameCount);
    set1f(p,'uSteps', steps);
  }

  const read = ping, write = 1 - ping;
  const vread = ping, vwrite = 1 - ping;

  gl.bindVertexArray(vao);

  /* pasada 0 — física del fluido (sólo FLOW) */
  if(sceneIdx === 4 && progVel){
    gl.bindFramebuffer(gl.FRAMEBUFFER, vfbo[vwrite].f);
    gl.viewport(0, 0, W, H);
    gl.useProgram(progVel);
    common(progVel);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vfbo[vread].t); set1i(progVel,'uVel',0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, camTex);        set1i(progVel,'uCam',1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* pasada 1 — color */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[write].f);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progSim);
  common(progSim);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbo[read].t);    set1i(progSim,'uPrev',0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, camTex);         set1i(progSim,'uCam',1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, vfbo[vwrite].t); set1i(progSim,'uVel',2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* pasada 2 — salida */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progOut);
  common(progOut);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbo[write].t);   set1i(progOut,'uTex',0);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, vfbo[vwrite].t); set1i(progOut,'uVel',2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  ping = write;
}
if(gl && progSim && progOut && progVel) requestAnimationFrame(frame);

if(!window.isSecureContext) toast('Ábrelo por HTTPS para cámara y mic');
</script>
</body>
</html>
